# Track A: VideoMAE ViT-Base visual model on LRS3 trainval (VALLR's 30-hour setting). Kaggle T4 GPU.
# `index` is set by notebook 03 to the list of lrs3_trainval_shard*/index.jsonl files.
index: []
out_dir: /kaggle/working/runs/visual_lrs3_vit
train_split: train
val_split: val
seed: 0

model:
  arch: vit
  pretrained: MCG-NJU/videomae-base   # self-supervised on Kinetics-400 (no lip data)
  image_size: 112          # 88x88 mouth crops are resized to 112x112 (7x7 patches of 16 px)
  window: 16               # frames per ViT window (8 tubelets of 2 frames)
  train_layers: 4          # top 4 of 12 ViT layers fine-tuned
  lora_r: 8                # LoRA (attention output + MLP) on the 8 frozen layers; 0 = fully frozen
  lora_alpha: 16
  d_model: 256             # temporal Transformer over the whole sentence
  heads: 4
  layers: 4
  viseme_layer: 2
  dropout: 0.1
  window_batch: 32         # windows per ViT forward pass (memory)

viseme_weight: 0.3       # loss = phoneme CTC + 0.3 * viseme CTC
max_train_frames: 200    # skip training clips longer than 8 s (GPU memory)
epochs: 20
batch_size: 4
lr: 0.0003               # new layers (temporal Transformer, heads)
encoder_lr_scale: 0.1    # ViT layers and LoRA: lr * 0.1
weight_decay: 0.01
warmup_epochs: 1
grad_clip: 5.0
num_workers: 2
log_every: 200
val_batches: 80          # ~320 clips per epoch-end validation
